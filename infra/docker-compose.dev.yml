# LokLens News - LOCAL DEVELOPMENT ONLY. Not used on staging/production.
#
#   npm run db:up      start Postgres (waits until healthy)
#   npm run db:down    stop containers (data is kept in the named volume)
#   npm run db:logs    follow Postgres logs
#   docker compose -f infra/docker-compose.dev.yml --profile tools up -d   also start Adminer
#
# Credentials default to loklens / loklens / loklens and can be overridden with
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB / POSTGRES_PORT in your shell.
# If you change them, update DATABASE_URL in apps/web/.env to match.
# Ports are bound to 127.0.0.1 only, so nothing is exposed to your network.
# Wipe the database completely (deletes all local data):
#   docker compose -f infra/docker-compose.dev.yml down -v

name: loklens-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loklens}
      POSTGRES_DB: ${POSTGRES_DB:-loklens}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:4
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
