# LokLens News - server stack (development first; production later on its own domain and volumes).
# Run through infra/server/deploy-dev.sh, which passes --env-file apps/web/.env.
# Not for local use: local development uses infra/docker-compose.dev.yml.

name: loklens-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in apps/web/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/web/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in apps/web/.env}
      TZ: Asia/Kolkata
    # Only the host can reach the database (the host runs migrations and the build). Not public.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: infra/server/Dockerfile.app
    restart: unless-stopped
    env_file:
      - ../../apps/web/.env
    # Inside the Docker network the database is reachable as "db", not localhost.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/apps/web/media
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Required: the deploy stops here instead of serving the dev site without its password.
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in apps/web/.env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in apps/web/.env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in apps/web/.env (caddy hash-password)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
